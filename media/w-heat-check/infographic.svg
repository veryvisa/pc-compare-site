<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1447" width="900" height="1447" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">冬天出远门，保险公司要求多久有人进屋看一次？</title>
<desc id="d">只开暖气不一定满足冻管水损条件。各家条款要求不同，必须按自己的保单版本执行，不能取三家中最宽松的一项；做不到，冻管水损可能不赔。</desc>
<rect width="900" height="1447" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="122" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">暖气开着不够 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">冬天出远门，保险公司要求多久有人进屋看一次？</text>
<rect x="40" y="146" width="820" height="132" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="177" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="213" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">只开暖气不一定满足冻管水损条件。各家条款要求不同，必须按自己的保单版本执</text>
<text x="64" y="246" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">行，不能取三家中最宽松的一项；做不到，冻管水损可能不赔。</text>
<text x="40" y="322" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">三家分栏看（数字只代表该公司）</text>
<rect x="40.0" y="342" width="264.0" height="308" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="54.0" y="374" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">BCAA</text>
<text x="54.0" y="402" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">触发点</text>
<text x="54.0" y="424" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">取暖季无人居住连续超过 14 天</text>
<text x="54.0" y="458" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">进屋频率</text>
<text x="54.0" y="480" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">每隔一天进屋查看</text>
<text x="54.0" y="514" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">替代动作</text>
<text x="54.0" y="536" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">关总阀并排空管道</text>
<text x="54.0" y="571" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">出处</text>
<text x="54.0" y="593" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">BCAA 房屋险条款（bcaa.co</text>
<text x="54.0" y="616" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">m）</text>
<rect x="318.0" y="342" width="264.0" height="308" rx="14" fill="#E6F4F3" stroke="#0E7C7B" stroke-width="1.5"/>
<text x="332.0" y="374" font-size="19" fill="#0E7C7B" font-weight="700" text-anchor="start">Square One</text>
<text x="332.0" y="402" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">触发点</text>
<text x="332.0" y="424" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">取暖季离家超过 7 天</text>
<text x="332.0" y="458" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">进屋频率</text>
<text x="332.0" y="480" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">每天查看供暖</text>
<text x="332.0" y="514" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">替代动作</text>
<text x="332.0" y="536" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">关水并排空</text>
<text x="332.0" y="571" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">出处</text>
<text x="332.0" y="593" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">squareone.ca 公开说明</text>
<rect x="596.0" y="342" width="264.0" height="308" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="610.0" y="374" font-size="19" fill="#B45309" font-weight="700" text-anchor="start">TD</text>
<text x="610.0" y="402" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">触发点</text>
<text x="610.0" y="424" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">离家超过一周</text>
<text x="610.0" y="458" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">进屋频率</text>
<text x="610.0" y="480" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">至少每 7 天有人进入</text>
<text x="610.0" y="514" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">另外</text>
<text x="610.0" y="536" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">温度维持在不低于 13°C</text>
<text x="610.0" y="571" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">出处</text>
<text x="610.0" y="593" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">tdinsurance.com 公开建议</text>
<text x="40" y="694" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">四个动作不是一回事</text>
<rect x="40" y="712" width="820" height="192" rx="14" fill="#F4F6F9" stroke="#5B6B7F" stroke-width="1.5"/>
<text x="58" y="746" font-size="20" fill="#5B6B7F" font-weight="700" text-anchor="start">开暖气 ≠ 进屋检查 ≠ 关总水阀 ≠ 排空管道</text>
<circle cx="64" cy="775" r="3.2" fill="#5B6B7F"/>
<text x="76" y="780" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">开暖气：只是保温，不替代条款要求的查看</text>
<circle cx="64" cy="806" r="3.2" fill="#5B6B7F"/>
<text x="76" y="812" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">进屋检查：有人真的进屋，看供暖、室温和水迹</text>
<circle cx="64" cy="838" r="3.2" fill="#5B6B7F"/>
<text x="76" y="843" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">关总水阀并排空管道：部分条款接受的替代做法，两步都要做</text>
<circle cx="64" cy="870" r="3.2" fill="#5B6B7F"/>
<text x="76" y="874" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">远程温控不能自动替代条款要求的进屋检查</text>
<rect x="40" y="926" width="820" height="129" rx="14" fill="#E9F7EF" stroke="#1A7F4B" stroke-width="1.5"/>
<text x="58" y="960" font-size="20" fill="#1A7F4B" font-weight="700" text-anchor="start">留痕：每次看房记一行</text>
<circle cx="64" cy="989" r="3.2" fill="#1A7F4B"/>
<text x="76" y="994" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">日期、进屋人、室温、供暖是否正常、有没有水迹，并拍照</text>
<circle cx="64" cy="1020" r="3.2" fill="#1A7F4B"/>
<text x="76" y="1026" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">理赔以事故时有效保单、批单及已履行记录为准</text>
<rect x="40" y="1077" width="820" height="160" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1111" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="1140" r="3.2" fill="#B45309"/>
<text x="76" y="1145" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">14 天是触发点，不是每 14 天查看一次：BCAA 触发后要每隔一天进屋。</text>
<circle cx="64" cy="1172" r="3.2" fill="#B45309"/>
<text x="76" y="1176" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">不是所有保险公司都是 7 天，远程摄像头也不一定够。</text>
<circle cx="64" cy="1203" r="3.2" fill="#B45309"/>
<text x="76" y="1208" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">做了检查也不保证所有冻管水损必赔：先把自己保单的原句抄下来对照。</text>
<line x1="40" y1="1264" x2="860" y2="1264" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1288" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1310" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">BCAA Home/Condo/Tenant Comprehensive 条款（2025-09-24 版，bcaa.com）</text>
<text x="40" y="1333" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Square One · Water damage（squareone.ca/home/water）</text>
<text x="40" y="1355" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">TD Insurance · Home security tips while on vacation（tdinsurance.com）</text>
<text x="40" y="1383" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">本站正文核对日 2026-09-24。14 天、7 天分别是触发或查看条件，不是行业统一宽限期；各家条款会改版，以你自己的保单版</text>
<text x="40" y="1404" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">本为准。</text>
</svg>
