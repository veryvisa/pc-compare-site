<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1786" width="900" height="1786" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">回国探亲几个月，房子空着保险还有效吗？</title>
<desc id="d">回国几个月通常是计划返回的暂时无人居住，不应自动写成空置；搬走且无意返回、换租客空档等才可能按保单定义成为空置。家具是否留在屋里不一定改变认定。</desc>
<rect width="900" height="1786" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="122" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">回国几个月：空置与无人居住 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">回国探亲几个月，房子空着保险还有效吗？</text>
<rect x="40" y="146" width="820" height="165" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="177" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="213" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">回国几个月通常是计划返回的暂时无人居住，不应自动写成空置；搬走且无意返</text>
<text x="64" y="246" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">回、换租客空档等才可能按保单定义成为空置。家具是否留在屋里不一定改变认</text>
<text x="64" y="279" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">定。</text>
<text x="40" y="355" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">核心差别：是否计划返回</text>
<rect x="40.0" y="375" width="403.0" height="172" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="54.0" y="407" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">暂时无人居住（unoccupied）</text>
<text x="54.0" y="435" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">典型情形</text>
<text x="54.0" y="457" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">回国探亲、长期旅行，计划回来</text>
<text x="54.0" y="491" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">要做的事</text>
<text x="54.0" y="513" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">通知保险方，冬季按本保单安排进屋检查或关水排空</text>
<rect x="457.0" y="375" width="403.0" height="172" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="471.0" y="407" font-size="19" fill="#B42318" font-weight="700" text-anchor="start">空置（vacant）</text>
<text x="471.0" y="435" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">典型情形</text>
<text x="471.0" y="457" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">搬走且无意返回、搬走待售、换租客空档</text>
<text x="471.0" y="491" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">可能的后果</text>
<text x="471.0" y="513" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">触发不同定义、通知义务与水损限制</text>
<text x="40" y="591" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">离家前分四步</text>
<rect x="40" y="609" width="820" height="98" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58" y="643" font-size="20" fill="#2F5D8A" font-weight="700" text-anchor="start">① 通知保险方</text>
<circle cx="64" cy="672" r="3.2" fill="#2F5D8A"/>
<text x="76" y="677" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">IBC 建议：延长旅行超过 30 天，通知保险方</text>
<line x1="450" y1="709" x2="450" y2="736" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,733 L458,733 L450,745 Z" fill="#5B6B7F"/>
<rect x="40" y="747" width="820" height="98" rx="14" fill="#E6F4F3" stroke="#0E7C7B" stroke-width="1.5"/>
<text x="58" y="781" font-size="20" fill="#0E7C7B" font-weight="700" text-anchor="start">② 取得书面接受</text>
<circle cx="64" cy="810" r="3.2" fill="#0E7C7B"/>
<text x="76" y="815" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">报备不等于所有水损继续有效，问清接受的条件</text>
<line x1="450" y1="846" x2="450" y2="873" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,870 L458,870 L450,882 Z" fill="#5B6B7F"/>
<rect x="40" y="884" width="820" height="98" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="918" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">③ 冬季防冻</text>
<circle cx="64" cy="947" r="3.2" fill="#B45309"/>
<text x="76" y="952" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">按本保单保持供暖，或关水并排空管道</text>
<line x1="450" y1="984" x2="450" y2="1011" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,1008 L458,1008 L450,1020 Z" fill="#5B6B7F"/>
<rect x="40" y="1022" width="820" height="129" rx="14" fill="#E9F7EF" stroke="#1A7F4B" stroke-width="1.5"/>
<text x="58" y="1056" font-size="20" fill="#1A7F4B" font-weight="700" text-anchor="start">④ 现场检查（两家提示不同）</text>
<circle cx="64" cy="1085" r="3.2" fill="#1A7F4B"/>
<text x="76" y="1090" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">IBC 提示：冬季离家时，每三天安排人员进屋检查冻管风险</text>
<circle cx="64" cy="1116" r="3.2" fill="#1A7F4B"/>
<text x="76" y="1121" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">Square One 建议：取暖季每天查看，或关水排空</text>
<rect x="40" y="1173" width="820" height="98" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="58" y="1207" font-size="20" fill="#B42318" font-weight="700" text-anchor="start">Square One 的水损边界（只代表其公开说明）</text>
<circle cx="64" cy="1236" r="3.2" fill="#B42318"/>
<text x="76" y="1241" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">其自家空置满 30 天后排除水损；Square One 也说明各家处理不同</text>
<rect x="40" y="1292" width="820" height="98" rx="14" fill="#F4F6F9" stroke="#5B6B7F" stroke-width="1.5"/>
<text x="58" y="1326" font-size="20" fill="#5B6B7F" font-weight="700" text-anchor="start">向自己的保险方核对</text>
<circle cx="64" cy="1355" r="3.2" fill="#5B6B7F"/>
<text x="76" y="1360" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">定义、起算日、允许空置期、水损与恶意破坏限制、查看频率和记录</text>
<rect x="40" y="1412" width="820" height="186" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1446" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="1475" r="3.2" fill="#B45309"/>
<text x="76" y="1480" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">留家具、收邮件或偶尔回去，不一定就不算空置。</text>
<circle cx="64" cy="1506" r="3.2" fill="#B45309"/>
<text x="76" y="1511" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">报备获批不等于所有水损继续有效。</text>
<circle cx="64" cy="1538" r="3.2" fill="#B45309"/>
<text x="76" y="1543" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">超过 30 天不是全国统一自动失效规则：IBC 的 30 天是通知提示，Square One 的 30 天只代</text>
<text x="76" y="1568" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">表其自家规则。</text>
<line x1="40" y1="1624" x2="860" y2="1624" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1649" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1671" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">IBC · What is covered when I go on a March break vacation（ibc.ca）</text>
<text x="40" y="1693" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Square One · Insuring vacant dwellings（squareone.ca）</text>
<text x="40" y="1722" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">本站正文核对日 2026-10-14。IBC 的 30 天通知和每三天检查是消费者提示，不是所有保单的统一条款；装修、季节住宅和短租</text>
<text x="40" y="1742" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">还有各自分类。</text>
</svg>
